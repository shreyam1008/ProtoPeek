name: Native agent client acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/native-agent-clients.yml'
      - 'scripts/native-agent-clients.py'
      - 'web/src/console/agent-client-config.ts'
      - 'web/src/console/AgentClientSetup.tsx'
      - 'internal/agentlink/**'
      - 'internal/cli/**'
      - 'standalone/**'
      - 'cmd/pp/**'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/native-agent-clients.yml'
      - 'scripts/native-agent-clients.py'
      - 'web/src/console/agent-client-config.ts'
      - 'web/src/console/AgentClientSetup.tsx'
      - 'internal/agentlink/**'
      - 'internal/cli/**'
      - 'standalone/**'
      - 'cmd/pp/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-local-clients:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.19.0
      - name: Build the actual native launcher
        run: |
          go build -mod=readonly -tags protopeek_lite -o "$RUNNER_TEMP/pp-agent-clients" ./cmd/pp
          sha256sum "$RUNNER_TEMP/pp-agent-clients"
      - name: Download and verify pinned official client releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/agent-client-assets"
          mkdir -p "$assets/opencode" "$assets/claude" "$assets/gemini"
          fetch() {
            local repo="$1" tag="$2" name="$3" expected="$4" destination="$5"
            local metadata
            metadata="$(gh api "repos/$repo/releases/tags/$tag" --jq ".assets[] | select(.name == \"$name\") | .digest")"
            test "$metadata" = "sha256:$expected"
            gh release download "$tag" --repo "$repo" --pattern "$name" --dir "$assets"
            printf '%s  %s\n' "$expected" "$assets/$name" | sha256sum --check --status
            case "$name" in
              *.tar.gz) tar -xzf "$assets/$name" -C "$destination" ;;
              *.zip) unzip -q "$assets/$name" -d "$destination" ;;
            esac
            rm "$assets/$name"
          }
          fetch anomalyco/opencode v1.19.5 opencode-linux-x64.tar.gz 588310a336fa3b9df36b3f0225b26f679d453efaad0cf3d66c3651ef3ec1647a "$assets/opencode"
          fetch anthropics/claude-code v2.1.318 claude-linux-x64.tar.gz e6d426ca0c123f61fad58a361da0329f2a93cd206bc87040ed8d9576dd9eb583 "$assets/claude"
          fetch google-gemini/gemini-cli v0.67.0 gemini-cli-bundle.zip 53371261bc56ebd5b3d1d6c400e07854e8d674f4e06365bae38443c1dc1312d3 "$assets/gemini"
          test -f "$assets/opencode/opencode"
          test -f "$assets/claude/claude"
          test -f "$assets/gemini/gemini.js"
          chmod u+x "$assets/opencode/opencode" "$assets/claude/claude"
      - name: Verify local client connections without external network
        run: |
          sudo unshare --net -- bash -c 'set -e; ip link set lo up; exec runuser -u "$1" -- python3 "$2" "$3" "$4" "$5" "$6" "$7"' _ \
            "$(id -un)" "$GITHUB_WORKSPACE/scripts/native-agent-clients.py" "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/pp-agent-clients" "$RUNNER_TEMP/agent-client-assets" "$(command -v node)" "$RUNNER_TEMP"
