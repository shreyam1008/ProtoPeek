name: Native release acceptance

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      tag:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      previous_tag:
        required: true
        type: string

# Permissions are inherited from the caller: draft visibility needs contents
# write, while public acceptance is read only. setup-go receives no token.
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          token: ''
      - name: Download only the bounded authenticated draft asset plan
        if: inputs.mode == 'draft'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.expected_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'PowerShell 7.4+ is required to preserve binary download bytes.' }
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          $assets = Join-Path $env:RUNNER_TEMP 'protopeek-release-draft-assets'
          New-Item -ItemType Directory -Path $assets -ErrorAction Stop | Out-Null
          $metadata = Join-Path $assets 'release-metadata.json'
          $draftMatches = @()
          for ($page = 1; $page -le 10; $page++) {
            $raw = & gh api --method GET "repos/$env:GITHUB_REPOSITORY/releases?per_page=100&page=$page"
            if ($LASTEXITCODE -ne 0) { throw 'Draft release list read failed.' }
            $releases = @($raw | ConvertFrom-Json)
            $draftMatches += @($releases | Where-Object { $_.tag_name -ceq $env:RELEASE_TAG -and $_.draft -eq $true })
            if ($releases.Count -lt 100) { break }
            if ($page -eq 10) { throw 'Release pagination exceeded its bound.' }
          }
          if ($draftMatches.Count -ne 1) { throw 'Expected exactly one draft with the requested tag.' }
          $draftMatches[0] | ConvertTo-Json -Depth 100 | Out-File -LiteralPath $metadata -Encoding utf8
          $plan = & $python scripts/verify-published-release.py --tag $env:RELEASE_TAG --sha $env:RELEASE_SHA --draft-plan $metadata
          if ($LASTEXITCODE -ne 0) { throw 'Draft download plan validation failed.' }
          $download = $plan | ConvertFrom-Json
          if ($download.releaseId -ne $draftMatches[0].id) { throw 'Draft release identity changed.' }
          foreach ($asset in $download.assets) {
            & gh api --method GET $asset.url --header 'Accept: application/octet-stream' > (Join-Path $assets $asset.name)
            if ($LASTEXITCODE -ne 0) { throw "Draft asset API download failed: $($asset.name)" }
          }
      - name: Verify selected release mode, install and upgrade
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.expected_sha }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          $arguments = @('scripts/verify-published-release.py', '--tag', $env:RELEASE_TAG, '--sha', $env:RELEASE_SHA, '--previous-tag', $env:PREVIOUS_TAG, '--mode', $env:RELEASE_MODE, '--install', '--ephemeral-default', '--output', (Join-Path $env:RUNNER_TEMP 'protopeek-release-acceptance'))
          if ($env:RELEASE_MODE -eq 'draft') {
            $assets = Join-Path $env:RUNNER_TEMP 'protopeek-release-draft-assets'
            $arguments += @('--metadata', (Join-Path $assets 'release-metadata.json'), '--asset-dir', $assets)
          }
          & $python @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protopeek-release-verification-${{ runner.os }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/protopeek-release-acceptance/report.json
            ${{ runner.temp }}/protopeek-release-acceptance/*.log
            ${{ runner.temp }}/protopeek-release-acceptance/*metadata.json
          if-no-files-found: error
