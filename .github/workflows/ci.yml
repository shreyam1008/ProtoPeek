name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  go-vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check reachable Go vulnerabilities
        env:
          GOFLAGS: -mod=readonly
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and probe non-root scratch image
        run: make docker-smoke

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Frontend quality gate
        run: bun run test

      - name: Verify Windows manifest preparation boundaries
        run: bun test scripts/prepare-winget.test.ts

      - name: Build site and embedded app
        run: bun run build

      - name: Verify generated assets and prerender
        shell: bash
        run: |
          test -z "$(git status --porcelain -- docs internal/resources/app/dist)"
          grep -Fq 'What is happening on this device?' docs/index.html
          if grep -Fq '<div id="root"></div>' docs/index.html; then
            echo 'Homepage was not prerendered.' >&2
            exit 1
          fi

  browser-acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.19.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - name: Build current embedded application
        run: |
          bun install --frozen-lockfile
          bun run build:app
      - name: Install locked browser test dependency
        run: npm ci --prefix scripts/browser-acceptance --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and Linux dependencies
        if: runner.os == 'Linux'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/protopeek-playwright
        run: node scripts/browser-acceptance/node_modules/playwright/cli.js install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/protopeek-playwright
        run: node scripts/browser-acceptance/node_modules/playwright/cli.js install chromium
      - name: Run native launcher browser acceptance
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/protopeek-playwright
        run: node scripts/browser-acceptance/acceptance.mjs

  web-build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Build site and embedded app on Windows
        run: |
          bun run build:app
          bun run build:site

      - name: Verify cross-platform generated assets
        shell: pwsh
        run: |
          $generatedChanges = git status --porcelain -- docs internal/resources/app/dist
          if ($generatedChanges) {
            $generatedChanges | Write-Error
            throw 'Windows generated assets differ from the committed build.'
          }

  go:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Go test
        run: go test ./...

      - name: Verify Windows lightweight companion
        if: runner.os == 'Windows'
        run: go test -tags protopeek_lite ./internal/bundledaria2 ./internal/extensions ./internal/transfer ./internal/cli ./standalone

      - name: Build lightweight Windows preview
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $preview = Join-Path $env:RUNNER_TEMP 'protopeek-lite-preview'
          ./scripts/build-lite-windows.ps1 -OutputDirectory $preview -CoreOnly
          if ($LASTEXITCODE -ne 0) { throw 'Lightweight preview build failed.' }
          $env:PROTOPEEK_STAGED_CORE = $preview
          go test -tags protopeek_lite ./scripts/releasecheck -run '^TestStagedCoreDownloadsWithManagedAria2$' -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw 'Staged CoreOnly companion lifecycle failed.' }

      - name: Archive the Windows companion-store preview
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protopeek-lite-windows-amd64
          path: ${{ runner.temp }}/protopeek-lite-preview/
          if-no-files-found: error
          retention-days: 14

      - name: Native Linux publishing evidence
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '0'
          GOFLAGS: -mod=readonly
          GOWORK: 'off'
        shell: bash
        run: |
          status=0
          go test -count=1 -json ./internal/publishsession -run '^(TestLinuxPublishing|TestLinuxOwned|TestPublishingHardParentDeath)' > native-linux-publishing-tests.jsonl || status=$?
          python3 - <<'PY'
          import json
          events = [json.loads(line) for line in open('native-linux-publishing-tests.jsonl', encoding='utf-8')]
          expected = {
              'TestLinuxPublishingRefusesForkingWrappersBeforeExecution',
              'TestLinuxOwnedStopAndCancellationCloseDescendantSocket',
              'TestPublishingHardParentDeathKillsOnlyOwnedChild',
              'TestLinuxPublishingAdmitsMatchingNativeVendorCommandIdentity',
              'TestLinuxPublishingRefusesKnownLauncherPaths',
          }
          passed = {event.get('Test') for event in events if event.get('Action') == 'pass'}
          missing = expected - passed
          for event in events:
              if event.get('Output'): print(event['Output'], end='')
          if missing: raise SystemExit('Missing native publishing test passes: ' + ', '.join(sorted(missing)))
          PY
          exit "$status"

      - name: Native macOS network evidence
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: '0'
        shell: bash
        run: |
          status=0
          go test -count=1 -json ./internal/netpath ./internal/thispc -run '^TestNativeDarwin' > native-darwin-tests.jsonl || status=$?
          python3 - <<'PY'
          import json
          events = [json.loads(line) for line in open('native-darwin-tests.jsonl', encoding='utf-8')]
          expected = {
              'TestNativeDarwinEchoReachesIPv4AndIPv6Loopback',
              'TestNativeDarwinCancellationClosesOwnedEndpoint',
              'TestNativeDarwinCountersObserveOwnedLoopbackTraffic',
          }
          passed = {event.get('Test') for event in events if event.get('Action') == 'pass'}
          missing = expected - passed
          for event in events:
              if event.get('Output'): print(event['Output'], end='')
          if missing: raise SystemExit('Missing native test passes: ' + ', '.join(sorted(missing)))
          PY
          exit "$status"

      - name: Local transfer and media concurrency checks
        if: runner.os == 'Linux'
        run: go test -race ./internal/localshare ./internal/media -count=1

      - name: Compile both commands
        run: go build ./cmd/protopeek ./cmd/pp

      - name: Native isolated agent and MCP smoke
        run: go run ./scripts/agent-smoke

      - name: Native managed cloudflared lifecycle
        timeout-minutes: 5
        env:
          PROTOPEEK_CLOUDFLARED_INTEGRATION: '1'
        run: go test -count=1 -v ./internal/managedtools -run '^TestNativeCloudflaredLifecycle$'

      - name: Verify installer and failure paths on Apple Silicon
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          bash scripts/test-install-pipeline.sh

  managed-macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Native Intel macOS managed cloudflared lifecycle
        timeout-minutes: 5
        env:
          PROTOPEEK_CLOUDFLARED_INTEGRATION: '1'
        run: go test -count=1 -v ./internal/managedtools -run '^TestNativeCloudflaredLifecycle$'

  installer-unix:
    name: installer-unix (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Exercise verified installer and failure paths
        run: bash scripts/test-install-pipeline.sh

  installer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Exercise verified installer and failure paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $env:RUNNER_TEMP 'protopeek-installer'
          $env:PROTOPEEK_NO_SHORTCUTS = '1'
          $payload = Join-Path $fixture 'payload'
          $installDir = Join-Path $fixture 'install'
          $archive = Join-Path $fixture 'protopeek_test_windows_x86_64.zip'
          New-Item -ItemType Directory -Path $payload -Force | Out-Null
          go build -ldflags '-X main.version=vtest' -o (Join-Path $payload 'protopeek.exe') ./cmd/protopeek
          go build -ldflags '-X main.version=vtest' -o (Join-Path $payload 'pp.exe') ./cmd/pp
          Compress-Archive -Path (Join-Path $payload '*') -DestinationPath $archive -Force
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksums = Join-Path $fixture 'checksums.txt'
          Set-Content -LiteralPath $checksums -Value "$hash  $([IO.Path]::GetFileName($archive))"

          $installSummary = & ./install.ps1 -DownloadUrl $archive -ChecksumUrl $checksums -InstallDir $installDir -NoPathUpdate 6>&1 | Out-String
          if ($installSummary -notlike '*check the aria2 engine*') { throw 'Missing engine guidance for the archive without a companion.' }
          & (Join-Path $installDir 'protopeek.exe') -version
          & (Join-Path $installDir 'pp.exe') -version

          $nightlyDir = Join-Path $fixture 'releases/v0.0.0-nightly'
          New-Item -ItemType Directory -Path $nightlyDir -Force | Out-Null
          $nightlyName = 'protopeek_0.0.0-nightly_windows_x86_64.zip'
          Copy-Item -LiteralPath $archive -Destination (Join-Path $nightlyDir $nightlyName)
          $companion = Get-Item 'internal/bundledaria2/assets/aria2-*-win-64bit-build*.zip'
          $companionHash = (Get-FileHash -LiteralPath $companion.FullName -Algorithm SHA256).Hash
          Copy-Item -LiteralPath $companion.FullName -Destination (Join-Path $nightlyDir "protopeek-$($companion.Name)")
          Set-Content -LiteralPath (Join-Path $nightlyDir 'checksums.txt') -Value "$hash  $nightlyName", "$companionHash  protopeek-$($companion.Name)"
          $env:PROTOPEEK_DOWNLOAD_BASE_URL = Join-Path $fixture 'releases'
          try {
            $nightlySummary = & ./install.ps1 -Channel nightly -InstallDir (Join-Path $fixture 'nightly-install') -NoPathUpdate 6>&1 | Out-String
            if ($nightlySummary -notlike '*install aria2 from Extensions*') { throw 'Missing on-demand setup guidance for the companion release.' }
            & (Join-Path $fixture 'nightly-install/protopeek.exe') -version
            & (Join-Path $fixture 'nightly-install/pp.exe') -version
          } finally {
            Remove-Item Env:PROTOPEEK_DOWNLOAD_BASE_URL
          }

          # Windows PowerShell 5.1 and pwsh must both support the documented
          # pipeline invocation, including running from System32.
          powershell.exe -NoProfile -File ./scripts/test-install-pipeline.ps1 -Installer ./install.ps1 -Archive $archive -Checksums $checksums -FixtureRoot (Join-Path $fixture 'windows-powershell')
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell pipeline installation failed.' }
          pwsh -NoProfile -File ./scripts/test-install-pipeline.ps1 -Installer ./install.ps1 -Archive $archive -Checksums $checksums -FixtureRoot (Join-Path $fixture 'pwsh')
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 7 pipeline installation failed.' }

          $replacement = Join-Path $fixture 'replaced-pp.exe'
          Set-Content -LiteralPath $replacement -Value 'replaced after install' -NoNewline
          Move-Item -LiteralPath $replacement -Destination (Join-Path $installDir 'pp.exe') -Force
          & ./install.ps1 -DownloadUrl $archive -ChecksumUrl $checksums -InstallDir $installDir -NoPathUpdate
          if ((Get-Content -LiteralPath (Join-Path $installDir 'pp.exe') -Raw) -ne 'replaced after install') { throw 'A replaced pp.exe alias was overwritten.' }

          $legacy = Join-Path $fixture 'protopeek_legacy_windows_x86_64.zip'
          Compress-Archive -Path (Join-Path $payload 'protopeek.exe') -DestinationPath $legacy -Force
          $legacyHash = (Get-FileHash -LiteralPath $legacy -Algorithm SHA256).Hash.ToLowerInvariant()
          $legacyChecksums = Join-Path $fixture 'legacy-checksums.txt'
          Set-Content -LiteralPath $legacyChecksums -Value "$legacyHash  $([IO.Path]::GetFileName($legacy))"
          $legacyInstall = Join-Path $fixture 'legacy-install'
          & ./install.ps1 -DownloadUrl $legacy -ChecksumUrl $legacyChecksums -InstallDir $legacyInstall -NoPathUpdate
          & (Join-Path $legacyInstall 'protopeek.exe') -version
          & (Join-Path $legacyInstall 'pp.exe') -version

          $conflictDir = Join-Path $fixture 'conflict'
          New-Item -ItemType Directory -Path $conflictDir -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $conflictDir 'pp.exe') -Value 'unrelated pp' -NoNewline
          & ./install.ps1 -DownloadUrl $archive -ChecksumUrl $checksums -InstallDir $conflictDir -NoPathUpdate
          if ((Get-Content -LiteralPath (Join-Path $conflictDir 'pp.exe') -Raw) -ne 'unrelated pp') { throw 'Conflicting pp.exe was overwritten.' }
          & (Join-Path $conflictDir 'protopeek.exe') -version

          $corrupt = Join-Path $fixture 'protopeek_corrupt_windows_x86_64.zip'
          Copy-Item -LiteralPath $archive -Destination $corrupt
          Add-Content -LiteralPath $corrupt -Value 'corrupt'
          $corruptChecksums = Join-Path $fixture 'corrupt-checksums.txt'
          Set-Content -LiteralPath $corruptChecksums -Value "$hash  $([IO.Path]::GetFileName($corrupt))"
          try {
            & ./install.ps1 -DownloadUrl $corrupt -ChecksumUrl $corruptChecksums -InstallDir (Join-Path $fixture 'corrupt-install') -NoPathUpdate
            throw 'Corrupt archive unexpectedly installed.'
          } catch {
            if ($_.Exception.Message -eq 'Corrupt archive unexpectedly installed.') { throw }
          }

          try {
            & ./install.ps1 -DownloadUrl $archive -ChecksumUrl (Join-Path $fixture 'missing.txt') -InstallDir (Join-Path $fixture 'missing-install') -NoPathUpdate
            throw 'Archive without checksums unexpectedly installed.'
          } catch {
            if ($_.Exception.Message -eq 'Archive without checksums unexpectedly installed.') { throw }
          }

  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test release verification trust and isolation boundaries
        run: python3 scripts/verify-published-release.test.py

      - name: Test isolated Snap version handoff
        run: bash scripts/test-snap-version.sh

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.51.0

      - name: Check stable GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: check --config .goreleaser.yml

      - name: Check edge GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: check --config .goreleaser.edge.yml

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Prepare bundled aria2 source companion
        run: |
          bun test scripts/package-aria2-sources.test.ts
          bun scripts/package-aria2-sources.ts .local/aria2-sources
          tar -czf .local/aria2-1.37.0-companion-sources.tar.gz -C .local aria2-sources

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean --config .goreleaser.yml

      - name: Verify Windows lightweight release binaries
        run: go run ./scripts/releasecheck dist

      - name: Verify archive, checksum, and SBOM contract
        shell: bash
        run: |
          set -euo pipefail
          archive_count=0
          for archive in dist/protopeek_*.tar.gz; do
            test -f "$archive" || continue
            archive_count=$((archive_count + 1))
            contents="$(tar -tzf "$archive")"
            grep -Eq '(^|/)protopeek$' <<<"$contents"
            grep -Eq '(^|/)pp$' <<<"$contents"
            grep -Eq '(^|/)THIRD_PARTY_NOTICES\.md$' <<<"$contents"
            grep -Eq '(^|/)third_party/licenses/quic-go-MIT.txt$' <<<"$contents"
            grep -Eq '(^|/)third_party/licenses/qpack-MIT.txt$' <<<"$contents"
            grep -Eq '(^|/)man/protopeek\.1$' <<<"$contents"
            grep -Eq '(^|/)man/pp\.1$' <<<"$contents"
            grep -Fq "$(basename "$archive")" dist/checksums.txt
            test -f "$archive.sbom.json"
          done
          for archive in dist/protopeek_*.zip; do
            test -f "$archive" || continue
            archive_count=$((archive_count + 1))
            contents="$(unzip -Z1 "$archive")"
            grep -Eq '(^|/)protopeek\.exe$' <<<"$contents"
            grep -Eq '(^|/)pp\.exe$' <<<"$contents"
            grep -Eq '(^|/)THIRD_PARTY_NOTICES\.md$' <<<"$contents"
            grep -Eq '(^|/)aria2-notices/COPYING$' <<<"$contents"
            grep -Eq '(^|/)aria2-notices/README.md$' <<<"$contents"
            grep -Eq '(^|/)third_party/licenses/go-capnp-MIT.txt$' <<<"$contents"
            grep -Eq '(^|/)third_party/licenses/quic-go-MIT.txt$' <<<"$contents"
            grep -Eq '(^|/)third_party/licenses/qpack-MIT.txt$' <<<"$contents"
            grep -Eq '(^|/)man/protopeek\.1$' <<<"$contents"
            grep -Eq '(^|/)man/pp\.1$' <<<"$contents"
            grep -Fq "$(basename "$archive")" dist/checksums.txt
            test -f "$archive.sbom.json"
          done
          test "$archive_count" -eq 8
          deb_count=0
          for package in dist/*.deb; do
            test -f "$package" || continue
            deb_count=$((deb_count + 1))
            contents="$(dpkg-deb --contents "$package")"
            grep -Eq '[[:space:]](\./|/)?usr/share/doc/protopeek/licenses/quic-go-MIT\.txt$' <<<"$contents"
            grep -Eq '[[:space:]](\./|/)?usr/share/doc/protopeek/licenses/qpack-MIT\.txt$' <<<"$contents"
            grep -Fq "$(basename "$package")" dist/checksums.txt
          done
          test "$deb_count" -eq 3
          # GoReleaser hashes checksum.extra_files at their source paths; it
          # does not stage them in dist. Keep the full checksum check strict.
          for extra in install.sh install.ps1 .local/aria2-1.37.0-companion-sources.tar.gz; do
            cp "$extra" "dist/$(basename "$extra")"
          done
          cp internal/bundledaria2/assets/aria2-1.37.0-win-64bit-build1.zip dist/protopeek-aria2-1.37.0-win-64bit-build1.zip
          test "$(wc -l < dist/checksums.txt)" -eq 23
          (cd dist && sha256sum --check checksums.txt)
          test -s .local/aria2-1.37.0-companion-sources.tar.gz
          source_contents="$(tar -tzf .local/aria2-1.37.0-companion-sources.tar.gz)"
          grep -Eq '(^|/)SOURCES.json$' <<<"$source_contents"
