name: Linux screen reader acceptance

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orca:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.19.0
      - name: Install isolated test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends orca speech-dispatcher speech-dispatcher-espeak-ng at-spi2-core dbus-x11 xvfb xauth openbox pulseaudio gsettings-desktop-schemas
          dpkg-query -W orca speech-dispatcher at-spi2-core
          npm ci --prefix scripts/browser-acceptance --ignore-scripts --no-audit --no-fund
          node scripts/browser-acceptance/node_modules/playwright/cli.js install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/protopeek-orca-browser
      - name: Build native launcher with committed embedded assets
        run: go build -mod=readonly -tags protopeek_lite -o "$RUNNER_TEMP/protopeek-orca" ./cmd/pp
      - name: Verify Orca dispatch attempts during keyboard navigation
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/protopeek-orca-browser
          PROTOPEEK_ORCA_BINARY: ${{ runner.temp }}/protopeek-orca
          PROTOPEEK_ORCA_LOG: ${{ runner.temp }}/orca-debug.log
          PROTOPEEK_ORCA_REPORT: ${{ runner.temp }}/orca-acceptance.txt
          NO_AT_BRIDGE: '0'
          GTK_A11Y: 'always'
          LANG: C.UTF-8
        run: timeout 180s dbus-run-session -- xvfb-run -a -s '-screen 0 1280x720x24' bash scripts/browser-acceptance/orca-session.sh
      - name: Preserve bounded diagnostic report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orca-acceptance-diagnostics
          path: ${{ runner.temp }}/orca-acceptance.txt
          if-no-files-found: warn
          retention-days: 7
