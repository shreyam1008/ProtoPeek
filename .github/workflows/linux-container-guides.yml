name: Isolated container and Kubernetes acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/linux-container-guides.yml'
      - 'scripts/native-container-acceptance.py'
      - 'scripts/native-kind-acceptance.py'
      - 'scripts/container_acceptance.py'
      - 'scripts/test_container_acceptance.py'
      - 'scripts/container-fixture/**'
      - 'cmd/pp/**'
      - 'internal/cli/cli.go'
      - 'internal/extensions/**'
      - 'standalone/standalone.go'
      - 'standalone/http_request.go'
      - 'standalone/admission.go'
      - 'web/src/console/extension-manifest.json'
      - 'web/src/console/extension-packs/extension-docker.ts'
      - 'web/src/console/extension-packs/extension-podman.ts'
      - 'web/src/console/extension-packs/extension-kubectl.ts'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/linux-container-guides.yml'
      - 'scripts/native-container-acceptance.py'
      - 'scripts/native-kind-acceptance.py'
      - 'scripts/container_acceptance.py'
      - 'scripts/test_container_acceptance.py'
      - 'scripts/container-fixture/**'
      - 'cmd/pp/**'
      - 'internal/cli/cli.go'
      - 'internal/extensions/**'
      - 'standalone/standalone.go'
      - 'standalone/http_request.go'
      - 'standalone/admission.go'
      - 'web/src/console/extension-manifest.json'
      - 'web/src/console/extension-packs/extension-docker.ts'
      - 'web/src/console/extension-packs/extension-podman.ts'
      - 'web/src/console/extension-packs/extension-kubectl.ts'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container-guides:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install native CLI dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends podman
          fi
          docker --version
          podman --version
          mkdir -p "$RUNNER_TEMP/protopeek-cluster-bin"
          curl --fail --show-error --silent --location --retry 3 --max-time 90 \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 -o "$RUNNER_TEMP/protopeek-cluster-bin/kind"
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  $RUNNER_TEMP/protopeek-cluster-bin/kind" | sha256sum --check --strict
          curl --fail --show-error --silent --location --retry 3 --max-time 90 \
            https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl -o "$RUNNER_TEMP/protopeek-cluster-bin/kubectl"
          echo "6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f  $RUNNER_TEMP/protopeek-cluster-bin/kubectl" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/protopeek-cluster-bin/kind" "$RUNNER_TEMP/protopeek-cluster-bin/kubectl"
          echo "$RUNNER_TEMP/protopeek-cluster-bin" >> "$GITHUB_PATH"
      - name: Build the native launcher
        env:
          CGO_ENABLED: '0'
        run: go build -mod=readonly -tags protopeek_lite -o "$RUNNER_TEMP/protopeek-container-pp" ./cmd/pp
      - name: Verify fixture ownership and cleanup guards
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s scripts -p 'test_container_acceptance.py'
      - name: Inspect real Docker and Podman loopback mappings
        run: python3 scripts/native-container-acceptance.py "$RUNNER_TEMP/protopeek-container-pp" --sudo-podman
      - name: Inspect a genuine kubectl service port-forward
        run: python3 scripts/native-kind-acceptance.py "$RUNNER_TEMP/protopeek-container-pp"
