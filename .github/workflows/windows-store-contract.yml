name: Windows Store package contract

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  msix:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Validate current lightweight and historical embedded MSIX packages
        shell: pwsh
        env:
          GOFLAGS: -mod=readonly
          CGO_ENABLED: '0'
        run: |
          $legacy = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'embedded-release')
          $base = 'https://github.com/shreyam1008/ProtoPeek/releases/download/v0.7.0'
          foreach ($name in 'protopeek_0.7.0_windows_x86_64.zip','checksums.txt') {
            Invoke-WebRequest -Uri "$base/$name" -OutFile (Join-Path $legacy $name)
          }
          ./packaging/windows/store/test-store.ps1 -WorkDirectory (Join-Path $env:RUNNER_TEMP 'store-contract') -LegacyDirectory $legacy
