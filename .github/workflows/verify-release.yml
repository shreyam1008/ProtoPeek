name: Verify release downloads and installation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Draft native acceptance before publication, or anonymous public installation
        required: true
        default: draft
        type: choice
        options: [draft, public]
      tag:
        description: Exact draft or published stable vMAJOR.MINOR.PATCH tag
        required: true
        type: string
      expected_sha:
        description: Exact full commit the published tag must resolve to
        required: true
        type: string
      previous_tag:
        description: Published stable version used for real upgrade acceptance
        default: v0.6.1
        required: true
        type: string

permissions:
  contents: read

# Only the selected draft invocation grants push visibility for unpublished
# assets. Both invocations execute the same three-OS acceptance implementation.
jobs:
  draft:
    if: inputs.mode == 'draft'
    permissions:
      contents: write
    uses: ./.github/workflows/release-native-acceptance.yml
    with:
      mode: draft
      tag: ${{ inputs.tag }}
      expected_sha: ${{ inputs.expected_sha }}
      previous_tag: ${{ inputs.previous_tag }}
  public:
    if: inputs.mode == 'public'
    permissions:
      contents: read
    uses: ./.github/workflows/release-native-acceptance.yml
    with:
      mode: public
      tag: ${{ inputs.tag }}
      expected_sha: ${{ inputs.expected_sha }}
      previous_tag: ${{ inputs.previous_tag }}
