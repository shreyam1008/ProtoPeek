name: Edge Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: edge-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Validate release candidate and generated assets
        shell: bash
        run: |
          set -euo pipefail
          bun run test
          bun run build
          go test ./...
          test -z "$(git status --porcelain -- docs internal/resources/app/dist)"

      - name: Capture Vite 8.0.16 Linux assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vite-8.0.16-linux-assets
          path: |
            docs
            internal/resources/app/dist
          if-no-files-found: error

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.51.0

      - name: Validate edge packaging before changing the public edge release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean --config .goreleaser.edge.yml

      - name: Refresh edge tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh release delete v0.0.0-edge --yes --cleanup-tag || true
          git tag -f v0.0.0-edge
          git push origin refs/tags/v0.0.0-edge --force

      - name: Publish edge binaries
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean --config .goreleaser.edge.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest edge archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
