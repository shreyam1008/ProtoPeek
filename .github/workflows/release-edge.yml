name: Edge Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Validate release candidate
        run: |
          bun run test
          bun run build
          go test ./...

      - name: Refresh edge tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh release delete v0.0.0-edge --yes --cleanup-tag || true
          git tag -f v0.0.0-edge
          git push origin refs/tags/v0.0.0-edge --force

      - name: Publish edge binaries
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --config .goreleaser.edge.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
