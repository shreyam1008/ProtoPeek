name: Check Linux package configuration

on:
  workflow_dispatch:
  push:
    paths: ['.goreleaser.yml', '.github/workflows/package-check.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          distribution: goreleaser
          version: v2.17.1
          args: check --config .goreleaser.yml
