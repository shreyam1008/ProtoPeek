name: Release

on:
  push:
    tags:
      - 'v*'
      - '!v*-*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Guard stable tag and source branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Stable releases require an exact vMAJOR.MINOR.PATCH tag." >&2
            exit 1
          fi
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || {
            echo "Release tag must point to a commit contained in origin/master." >&2
            exit 1
          }
          release_version="${GITHUB_REF_NAME#v}"
          for manual in web/site/public/man/protopeek.1 web/site/public/man/pp.1; do
            manual_title="$(awk -F '"' 'NR == 1 { print $4 }' "$manual")"
            if [[ "$manual_title" != "ProtoPeek $release_version" ]]; then
              echo "$manual identifies itself as '$manual_title'; expected 'ProtoPeek $release_version' for $GITHUB_REF_NAME." >&2
              echo "Promote the current-source manuals before creating the stable tag." >&2
              exit 1
            fi
          done

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Validate tagged source and generated assets
        shell: bash
        run: |
          set -euo pipefail
          bun run test
          bun run build
          go test ./...
          test -z "$(git status --porcelain -- docs internal/resources/app/dist)"

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.51.0

      - name: Prepare bundled aria2 source companion
        run: |
          bun test scripts/package-aria2-sources.test.ts
          bun scripts/package-aria2-sources.ts .local/aria2-sources
          tar -czf .local/aria2-1.37.0-companion-sources.tar.gz -C .local aria2-sources

      - name: Verify the release is unpublished before uploading
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: bash scripts/guard-release-draft.sh allow-absent

      - name: Build draft release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean --config .goreleaser.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: Verify draft Windows lightweight binaries
        run: go run ./scripts/releasecheck dist

      - name: Verify archive, checksum, and SBOM contract
        shell: bash
        run: |
          set -euo pipefail
          archive_count=0
          for archive in dist/protopeek_*.tar.gz; do
            test -f "$archive" || continue
            archive_count=$((archive_count + 1))
            contents="$(tar -tzf "$archive")"
            grep -Eq '(^|/)protopeek$' <<<"$contents"
            grep -Eq '(^|/)pp$' <<<"$contents"
            grep -Eq '(^|/)THIRD_PARTY_NOTICES\.md$' <<<"$contents"
            grep -Eq '(^|/)third_party/licenses/quic-go-MIT.txt$' <<<"$contents"
            grep -Eq '(^|/)third_party/licenses/qpack-MIT.txt$' <<<"$contents"
            grep -Eq '(^|/)man/protopeek\.1$' <<<"$contents"
            grep -Eq '(^|/)man/pp\.1$' <<<"$contents"
            grep -Fq "$(basename "$archive")" dist/checksums.txt
            test -f "$archive.sbom.json"
          done
          for archive in dist/protopeek_*.zip; do
            test -f "$archive" || continue
            archive_count=$((archive_count + 1))
            contents="$(unzip -Z1 "$archive")"
            grep -Eq '(^|/)protopeek\.exe$' <<<"$contents"
            grep -Eq '(^|/)pp\.exe$' <<<"$contents"
            grep -Eq '(^|/)THIRD_PARTY_NOTICES\.md$' <<<"$contents"
            grep -Eq '(^|/)aria2-notices/COPYING$' <<<"$contents"
            grep -Eq '(^|/)aria2-notices/README.md$' <<<"$contents"
            grep -Eq '(^|/)third_party/licenses/go-capnp-MIT.txt$' <<<"$contents"
            grep -Eq '(^|/)third_party/licenses/quic-go-MIT.txt$' <<<"$contents"
            grep -Eq '(^|/)third_party/licenses/qpack-MIT.txt$' <<<"$contents"
            grep -Eq '(^|/)man/protopeek\.1$' <<<"$contents"
            grep -Eq '(^|/)man/pp\.1$' <<<"$contents"
            grep -Fq "$(basename "$archive")" dist/checksums.txt
            test -f "$archive.sbom.json"
          done
          test "$archive_count" -eq 8
          deb_count=0
          for package in dist/*.deb; do
            test -f "$package" || continue
            deb_count=$((deb_count + 1))
            contents="$(dpkg-deb --contents "$package")"
            grep -Eq '[[:space:]](\./|/)?usr/share/doc/protopeek/licenses/quic-go-MIT\.txt$' <<<"$contents"
            grep -Eq '[[:space:]](\./|/)?usr/share/doc/protopeek/licenses/qpack-MIT\.txt$' <<<"$contents"
            grep -Fq "$(basename "$package")" dist/checksums.txt
          done
          test "$deb_count" -eq 3
          # GoReleaser hashes checksum.extra_files at their source paths; it
          # does not stage them in dist. Keep the full checksum check strict.
          for extra in install.sh install.ps1 .local/aria2-1.37.0-companion-sources.tar.gz; do
            cp "$extra" "dist/$(basename "$extra")"
          done
          cp internal/bundledaria2/assets/aria2-1.37.0-win-64bit-build1.zip dist/protopeek-aria2-1.37.0-win-64bit-build1.zip
          test "$(wc -l < dist/checksums.txt)" -eq 23
          (cd dist && sha256sum --check checksums.txt)
          test -s .local/aria2-1.37.0-companion-sources.tar.gz
          source_contents="$(tar -tzf .local/aria2-1.37.0-companion-sources.tar.gz)"
          grep -Eq '(^|/)SOURCES.json$' <<<"$source_contents"

      - name: Attest verified release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt

  snap:
    name: Attach Snap candidate
    runs-on: ubuntu-24.04
    needs: release
    if: needs.release.result == 'success'
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare the exact Snap version inside the build source
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/prepare-snap-version.sh "$TAG"

      - name: Build classic Snap candidate
        id: snapcraft
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1

      - name: Attach verified Snap and checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          command -v unsquashfs >/dev/null || { sudo apt-get update; sudo apt-get install -y squashfs-tools; }
          bash scripts/verify-snap.sh "$TAG" "${{ steps.snapcraft.outputs.snap }}"
          asset="protopeek_${TAG#v}_amd64.snap"
          bash scripts/test-snap-install.sh "$TAG" "dist/$asset"
          bash scripts/guard-release-draft.sh require-draft
          gh release upload "$TAG" "dist/$asset" "dist/${asset}.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Attest verified Snap candidate
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ./dist/*.snap

  store-contract:
    name: Validate Windows Store package contract
    needs: release
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: "Store package - Validate current lightweight and historical embedded MSIX packages"
        shell: pwsh
        env:
          GOFLAGS: -mod=readonly
          CGO_ENABLED: '0'
        run: |
          $legacy = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'embedded-release')
          $base = 'https://github.com/shreyam1008/ProtoPeek/releases/download/v0.7.0'
          foreach ($name in 'protopeek_0.7.0_windows_x86_64.zip','checksums.txt') {
            Invoke-WebRequest -Uri "$base/$name" -OutFile (Join-Path $legacy $name)
          }
          ./packaging/windows/store/test-store.ps1 -WorkDirectory (Join-Path $env:RUNNER_TEMP 'store-contract') -LegacyDirectory $legacy
