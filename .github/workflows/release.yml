name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Guard stable tag and source branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Stable releases require an exact vMAJOR.MINOR.PATCH tag." >&2
            exit 1
          fi
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || {
            echo "Release tag must point to a commit contained in origin/master." >&2
            exit 1
          }
          release_version="${GITHUB_REF_NAME#v}"
          for manual in web/site/public/man/protopeek.1 web/site/public/man/pp.1; do
            manual_title="$(awk -F '"' 'NR == 1 { print $4 }' "$manual")"
            if [[ "$manual_title" != "ProtoPeek $release_version" ]]; then
              echo "$manual identifies itself as '$manual_title'; expected 'ProtoPeek $release_version' for $GITHUB_REF_NAME." >&2
              echo "Promote the current-source manuals before creating the stable tag." >&2
              exit 1
            fi
          done

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Validate tagged source and generated assets
        shell: bash
        run: |
          set -euo pipefail
          bun run test
          bun run build
          go test ./...
          test -z "$(git status --porcelain -- docs internal/resources/app/dist)"

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.51.0

      - name: Build draft release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean --config .goreleaser.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
