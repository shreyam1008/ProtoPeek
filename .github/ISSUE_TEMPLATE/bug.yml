name: Bug report
description: Report a reproducible install, startup, protocol, or evidence problem.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make ProtoPeek reliable. Remove credentials, request bodies, internal hostnames, addresses, and private response evidence before posting.
  - type: input
    id: version
    attributes:
      label: ProtoPeek version
      description: Run `protopeek -version` or `pp -version`.
      placeholder: v0.3.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - Homebrew
        - Scoop
        - Unix release installer
        - PowerShell release installer
        - Release archive
        - go install
        - Docker build
        - Source build
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and architecture
      placeholder: macOS 15 arm64, Windows 11 amd64, Ubuntu 24.04 amd64
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: List the smallest safe sequence that reproduces the problem.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Select ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized evidence
      description: Paste only evidence you have reviewed and intentionally made public.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, request bodies, private hostnames/addresses, and sensitive response metadata.
          required: true
