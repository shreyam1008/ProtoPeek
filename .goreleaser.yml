version: 2

project_name: protopeek

builds:
  - id: protopeek
    binary: protopeek
    main: ./cmd/protopeek
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - 386
      - arm64
    ignore:
      - goos: darwin
        goarch: 386
    ldflags:
      - -s -w -X main.version=v{{ .Version }}
  - id: pp
    binary: pp
    main: ./cmd/pp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - 386
      - arm64
    ignore:
      - goos: darwin
        goarch: 386
    ldflags:
      - -s -w -X main.version=v{{ .Version }}

archives:
  - id: protopeek
    ids:
      - protopeek
      - pp
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}osx{{ else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else if eq .Arch "386" }}x86_32{{ else }}{{ .Arch }}{{ end }}
      {{- with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}
    files:
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - README.md
      - CHANGELOG.md
      - src: web/site/public/man/protopeek.1
        dst: man/protopeek.1
      - src: web/site/public/man/pp.1
        dst: man/pp.1

nfpms:
  - id: protopeek-deb
    package_name: protopeek
    ids: [protopeek, pp]
    file_name_template: "{{ .ConventionalFileName }}"
    homepage: https://protopeek.shreyam1008.com.np/
    maintainer: Shreyam Adhikari <shreyam1008@gmail.com>
    description: Local-first service inspection workbench with terminal and browser interfaces.
    license: MIT
    formats: [deb]
    bindir: /usr/bin
    section: net
    priority: optional
    contents:
      - src: LICENSE
        dst: /usr/share/doc/protopeek/copyright
      - src: THIRD_PARTY_NOTICES.md
        dst: /usr/share/doc/protopeek/THIRD_PARTY_NOTICES.md
      - src: web/site/public/man/protopeek.1
        dst: /usr/share/man/man1/protopeek.1
      - src: web/site/public/man/pp.1
        dst: /usr/share/man/man1/pp.1

checksum:
  name_template: checksums.txt

sboms:
  - id: archives
    artifacts: archive
    disable: false

release:
  draft: true
  extra_files:
    - glob: ./install.sh
    - glob: ./install.ps1
